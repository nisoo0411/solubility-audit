name: Solubility benchmark
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: curl -fsSL https://raw.githubusercontent.com/deepchem/deepchem/master/datasets/delaney-processed.csv -o esol.csv
      - run: node benchmark.mjs esol.csv results/exact-smiles
      - run: python rdkit_descriptors.py --input esol.csv
      - run: node benchmark.mjs rdkit-esol.csv results/scaffold
      - uses: actions/upload-artifact@v4
        with:
          name: solubility-results
          path: results/
